<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fertilizer Recommendation System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🌱 Fertilizer Recommendation System</h1>
      <p class="subtitle">Enter soil and crop details to get the best fertilizer suggestion</p>
    </header>

    <form id="predict-form" class="prediction-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="temperature">🌡️ Temperature (°C)</label>
          <input type="number" id="temperature" name="Temperature" min="0" max="50" step="0.1" required>
          <small>Range: 0-50°C</small>
        </div>

        <div class="form-group">
          <label for="moisture">💧 Moisture (%)</label>
          <input type="number" id="moisture" name="Moisture" min="0" max="100" step="0.1" required>
          <small>Range: 0-100%</small>
        </div>

        <div class="form-group">
          <label for="rainfall">🌧️ Rainfall (mm)</label>
          <input type="number" id="rainfall" name="Rainfall" min="0" max="3000" step="0.1" required>
          <small>Range: 0-3000mm</small>
        </div>

        <div class="form-group">
          <label for="ph">⚗️ pH Level</label>
          <input type="number" step="0.1" id="ph" name="PH" min="3" max="10" required>
          <small>Range: 3.0-10.0</small>
        </div>

        <div class="form-group">
          <label for="nitrogen">🔵 Nitrogen (N)</label>
          <input type="number" id="nitrogen" name="Nitrogen" min="0" max="200" required>
          <small>Range: 0-200</small>
        </div>

        <div class="form-group">
          <label for="phosphorous">🟡 Phosphorous (P)</label>
          <input type="number" id="phosphorous" name="Phosphorous" min="0" max="200" required>
          <small>Range: 0-200</small>
        </div>

        <div class="form-group">
          <label for="potassium">🔴 Potassium (K)</label>
          <input type="number" id="potassium" name="Potassium" min="0" max="200" required>
          <small>Range: 0-200</small>
        </div>

        <div class="form-group">
          <label for="carbon">⚫ Carbon</label>
          <input type="number" step="0.01" id="carbon" name="Carbon" min="0" max="10" required>
          <small>Range: 0-10</small>
        </div>

        <div class="form-group">
          <label for="soil">🏔️ Soil Type</label>
          <select id="soil" name="Soil" required>
            <option value="">-- Select Soil Type --</option>
            <option value="Acidic_Soil">Acidic Soil</option>
            <option value="Alkaline_Soil">Alkaline Soil</option>
            <option value="Loamy_Soil">Loamy Soil</option>
            <option value="Neutral_Soil">Neutral Soil</option>
            <option value="Peaty_Soil">Peaty Soil</option>
          </select>
        </div>

        <div class="form-group">
          <label for="crop">🌾 Crop Type</label>
          <select id="crop" name="Crop" required>
            <option value="">-- Select Crop --</option>
            <option value="Adzuki Beans">Adzuki Beans</option>
            <option value="Black gram">Black Gram</option>
            <option value="Chickpea">Chickpea</option>
            <option value="Coconut">Coconut</option>
            <option value="Coffee">Coffee</option>
            <option value="Cotton">Cotton</option>
            <option value="Ground Nut">Ground Nut</option>
            <option value="Jute">Jute</option>
            <option value="Kidney Beans">Kidney Beans</option>
            <option value="Lentil">Lentil</option>
            <option value="Moth Beans">Moth Beans</option>
            <option value="Mung Bean">Mung Bean</option>
            <option value="Peas">Peas</option>
            <option value="Pigeon Peas">Pigeon Peas</option>
            <option value="Rubber">Rubber</option>
            <option value="Sugarcane">Sugarcane</option>
            <option value="Tea">Tea</option>
            <option value="Tobacco">Tobacco</option>
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="grapes">Grapes</option>
            <option value="maize">Maize</option>
            <option value="mango">Mango</option>
            <option value="millet">Millet</option>
            <option value="muskmelon">Muskmelon</option>
            <option value="orange">Orange</option>
            <option value="papaya">Papaya</option>
            <option value="pomegranate">Pomegranate</option>
            <option value="rice">Rice</option>
            <option value="watermelon">Watermelon</option>
            <option value="wheat">Wheat</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-predict" id="predict-btn">
          <span class="btn-text">🔮 Predict Fertilizer</span>
          <span class="btn-loading" style="display: none;">🔄 Processing...</span>
        </button>
        <button type="reset" class="btn btn-reset">🔄 Reset Form</button>
      </div>
    </form>

    <div id="result" class="result-container">
      <div class="result-content">
        <h3>📊 Recommendation Result</h3>
        <div id="result-text" class="result-text"></div>
        <div id="result-details" class="result-details"></div>
      </div>
    </div>

    <footer>
      <p>🤖 AI-Powered Fertilizer Recommendation System</p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('predict-form');
    const resultContainer = document.getElementById('result');
    const resultText = document.getElementById('result-text');
    const resultDetails = document.getElementById('result-details');
    const predictBtn = document.getElementById('predict-btn');
    const btnText = predictBtn.querySelector('.btn-text');
    const btnLoading = predictBtn.querySelector('.btn-loading');

    // Form submission handler
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      // Show loading state
      setLoadingState(true);

      // Collect form data
      const formData = new FormData(this);
      const data = {};

      formData.forEach((value, key) => {
        if (!isNaN(value) && value.trim() !== "") {
          data[key] = parseFloat(value);
        } else {
          data[key] = value;
        }
      });

      console.log('Sending data:', data);

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        console.log('Received result:', result);

        if (result.success && result.prediction) {
          showResult(result.prediction, result.prediction_code, data);
        } else {
          showError(result.error || 'Unknown error occurred');
        }
      } catch (error) {
        console.error('Request failed:', error);
        showError('Failed to connect to server. Please try again.');
      } finally {
        setLoadingState(false);
      }
    });

    // Reset form handler
    form.addEventListener('reset', function() {
      hideResult();
    });

    function setLoadingState(loading) {
      if (loading) {
        btnText.style.display = 'none';
        btnLoading.style.display = 'inline';
        predictBtn.disabled = true;
        predictBtn.classList.add('loading');
      } else {
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
        predictBtn.disabled = false;
        predictBtn.classList.remove('loading');
      }
    }

    function showResult(fertilizer, code, inputData) {
      resultText.innerHTML = `
        <div class="prediction-result">
          <div class="fertilizer-name">🌱 ${fertilizer}</div>
          <div class="prediction-code">Prediction Code: ${code}</div>
        </div>
      `;

      resultDetails.innerHTML = `
        <div class="input-summary">
          <h4>📋 Input Summary:</h4>
          <div class="summary-grid">
            <div class="summary-item">
              <span class="label">🌡️ Temperature:</span>
              <span class="value">${inputData.Temperature}°C</span>
            </div>
            <div class="summary-item">
              <span class="label">💧 Moisture:</span>
              <span class="value">${inputData.Moisture}%</span>
            </div>
            <div class="summary-item">
              <span class="label">🌧️ Rainfall:</span>
              <span class="value">${inputData.Rainfall}mm</span>
            </div>
            <div class="summary-item">
              <span class="label">⚗️ pH:</span>
              <span class="value">${inputData.PH}</span>
            </div>
            <div class="summary-item">
              <span class="label">🔵 Nitrogen:</span>
              <span class="value">${inputData.Nitrogen}</span>
            </div>
            <div class="summary-item">
              <span class="label">🟡 Phosphorous:</span>
              <span class="value">${inputData.Phosphorous}</span>
            </div>
            <div class="summary-item">
              <span class="label">🔴 Potassium:</span>
              <span class="value">${inputData.Potassium}</span>
            </div>
            <div class="summary-item">
              <span class="label">⚫ Carbon:</span>
              <span class="value">${inputData.Carbon}</span>
            </div>
            <div class="summary-item">
              <span class="label">🏔️ Soil:</span>
              <span class="value">${inputData.Soil.replace('_', ' ')}</span>
            </div>
            <div class="summary-item">
              <span class="label">🌾 Crop:</span>
              <span class="value">${inputData.Crop}</span>
            </div>
          </div>
        </div>
      `;

      resultContainer.classList.add('show');
      resultContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function showError(message) {
      resultText.innerHTML = `
        <div class="error-result">
          <div class="error-icon">❌</div>
          <div class="error-message">${message}</div>
        </div>
      `;
      resultDetails.innerHTML = '';
      resultContainer.classList.add('show');
      resultContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function hideResult() {
      resultContainer.classList.remove('show');
    }

    // Add input validation
    document.querySelectorAll('input[type="number"]').forEach(input => {
      input.addEventListener('input', function() {
        const min = parseFloat(this.min);
        const max = parseFloat(this.max);
        const value = parseFloat(this.value);

        if (value < min) this.value = min;
        if (value > max) this.value = max;
      });
    });
  </script>
</body>
</html>
